services:
  traefik:
    image: traefik:v3.7
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - heliotyper

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - ./api:/app/api
      # Shared simulation. Built on the host; rebuild with
      # `pnpm --filter @heliotyper/engine build` after editing it.
      - ./packages:/app/packages
      - /app/api/node_modules
      - /app/node_modules
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      - postgres
      - redis
      - mailpit
    networks:
      - heliotyper
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.heliotyper.local`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    volumes:
      - ./web:/app/web
      # Read-only: the game's art is generated into assets/ and synced into
      # web/public/game at startup. The container never writes back.
      - ./assets:/app/assets:ro
      # Shared simulation, same as the api service.
      - ./packages:/app/packages
      - /app/web/node_modules
      - /app/node_modules
    environment:
      PORT: 3000
      WATCHPACK_POLLING: "true"
    networks:
      - heliotyper
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`heliotyper.local`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - heliotyper

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    networks:
      - heliotyper

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "1025:1025"
    networks:
      - heliotyper
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mail.heliotyper.local`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - heliotyper
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.heliotyper.local`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

networks:
  heliotyper:

volumes:
  postgres-data:
  pgadmin-data:
