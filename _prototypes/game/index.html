<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HelioTyper: Excalibur prototype</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #05060a;
        overflow: hidden;
        height: 100%;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #e8ecff;
      }

      /* ---- typing prompt ---- */
      #promptBox {
        position: absolute;
        bottom: 5%;
        left: 50%;
        transform: translateX(-50%);
        width: min(700px, 82vw);
        max-width: 82vw;
        box-sizing: border-box;
        background: rgba(10, 12, 24, 0.72);
        border: 1px solid rgba(120, 140, 255, 0.25);
        border-radius: 12px;
        padding: 20px 26px;
        font-size: 24px;
        line-height: 1.55;
        letter-spacing: 0.3px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        transition:
          border-color 0.08s,
          background 0.08s;
        overflow-wrap: break-word;
        text-align: center;
      }
      #promptBox.flash {
        border-color: #ff4d5e;
        background: rgba(60, 10, 16, 0.75);
      }
      /* ---- hull breach: the prompt stays readable, it just goes dead ----
         The sentence is never covered up. You can still read ahead and see
         exactly where you will resume; the panel just reads as powered down
         and being electrocuted, which is a much better signal than a modal
         that hides the one thing you are looking at. */
      #promptBox.stalled {
        border-color: #ff4d5e;
        background: rgba(40, 6, 10, 0.8);
        animation: stalledShake 0.16s steps(2) infinite;
      }
      /* Every step keeps the -50% that centres the box: a bare translateX here
         would replace it and throw the panel off to one side mid-stall. */
      @keyframes stalledShake {
        0% {
          transform: translateX(-50%);
        }
        25% {
          transform: translate(calc(-50% - 2px), 1px);
        }
        50% {
          transform: translate(calc(-50% + 2px), -1px);
        }
        75% {
          transform: translate(calc(-50% - 1px), 1px);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      /* Greyed out and dimmed: grayscale drains the amber cursor and the blue
         typed text to the same dead grey, so nothing on the panel looks like it
         is still accepting input. */
      #promptBox.stalled #promptText {
        filter: grayscale(1) brightness(0.66);
        opacity: 0.5;
      }
      #promptBox.stalled .ch.current {
        animation: none;
      }

      /* Arcs flickering across the dead panel. */
      #stallFx {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: none;
      }
      #promptBox.stalled #stallFx {
        display: block;
      }
      #stallFx svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #stallFx path {
        fill: none;
        stroke: #dff0ff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        /* The box is not square, so the SVG stretches; this keeps the bolts an
           even thickness instead of smearing them out horizontally. */
        vector-effect: non-scaling-stroke;
        filter: drop-shadow(0 0 5px #7fd0ff);
        opacity: 0;
        animation: arc 1.05s steps(1, end) infinite;
      }
      /* Deliberately mismatched durations, so the six never resynchronise into a
         visible marching pattern around the frame. */
      #stallFx path:nth-child(2) {
        animation-duration: 0.83s;
        animation-delay: 0.19s;
      }
      #stallFx path:nth-child(3) {
        animation-duration: 1.27s;
        animation-delay: 0.41s;
      }
      #stallFx path:nth-child(4) {
        animation-duration: 0.71s;
        animation-delay: 0.08s;
      }
      #stallFx path:nth-child(5) {
        animation-duration: 0.94s;
        animation-delay: 0.53s;
      }
      #stallFx path:nth-child(6) {
        animation-duration: 1.13s;
        animation-delay: 0.29s;
      }
      /* Short bursts, several per cycle: a bolt that is lit half the time reads
         as a drawn line rather than as a discharge, but too few and the panel
         just looks dark. Four paths on different durations means something is
         arcing most of the time without any one bolt lingering. */
      @keyframes arc {
        0%,
        3% {
          opacity: 0;
        }
        5% {
          opacity: 0.95;
        }
        9% {
          opacity: 0;
        }
        12% {
          opacity: 0.65;
        }
        15%,
        29% {
          opacity: 0;
        }
        32% {
          opacity: 0.9;
        }
        36%,
        60% {
          opacity: 0;
        }
        63% {
          opacity: 0.85;
        }
        67% {
          opacity: 0;
        }
        70% {
          opacity: 0.5;
        }
        73%,
        88% {
          opacity: 0;
        }
        91% {
          opacity: 0.8;
        }
        95%,
        100% {
          opacity: 0;
        }
      }
      #promptBox.stalled::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 12px;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, rgba(255, 70, 90, 0.13), transparent 72%);
        animation: breachFlash 0.44s steps(2) infinite;
      }
      @keyframes breachFlash {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }

      /* Status chip straddling the top border, so the countdown never sits on
         top of a word. */
      #stallBadge {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        align-items: center;
        gap: 9px;
        padding: 5px 14px;
        border-radius: 20px;
        background: #2a0810;
        border: 1px solid #ff4d5e;
        color: #ff8a95;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        white-space: nowrap;
        box-shadow: 0 0 14px rgba(255, 77, 94, 0.45);
      }
      #promptBox.stalled #stallBadge {
        display: flex;
      }
      #stallBadge b {
        color: #fff;
        letter-spacing: 1px;
      }
      #stallBadge .spark {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff4d5e;
        box-shadow: 0 0 8px #ff4d5e;
        animation: breachFlash 0.5s steps(2) infinite;
      }

      .ch.correct {
        /* Blue rather than green: on red-green color blindness (the common
           kind) a mint green desaturates toward the same grey as .ch.pending,
           so the two stop reading as different. Blue stays distinct from grey
           under every common form of color blindness. */
        color: #7ac0ff;
      }
      .ch.current {
        /* The "next key" marker can't lean on hue alone, since that's exactly
           what's hard to read for a color-blind player. A solid amber block is
           a brightness/shape cue instead of a color one, and the pulse adds a
           motion cue on top, so it still reads with no color vision at all.

           Padding is vertical-only and font-weight is left alone: either one
           changes this character's horizontal advance width, and since the
           "current" class hops to a new character every keystroke, that made
           every character after it shift sideways in sync with your typing.
           Vertical padding does not affect an inline element's layout width,
           so the highlight cannot bleed sideways into the next letter or
           shove the rest of the line around. */
        color: #1a1200;
        background: #ffcf6b;
        border-radius: 3px;
        padding: 3px 0;
        animation: curPulse 1.1s ease-in-out infinite;
      }
      @keyframes curPulse {
        0%,
        100% {
          box-shadow: 0 0 5px rgba(255, 207, 107, 0.4);
        }
        50% {
          box-shadow: 0 0 13px rgba(255, 207, 107, 0.85);
        }
      }
      .ch.pending {
        color: #6a7190;
      }

      /* ---- stats ---- */
      #statsBar {
        position: absolute;
        top: 3%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 28px;
        font-size: 14px;
        color: #9aa3c7;
        letter-spacing: 0.5px;
      }
      #statsBar b {
        color: #e8ecff;
        font-size: 16px;
      }

      /* ---- the run rail: one tick per body, so you can see what is next ---- */
      #rail {
        position: absolute;
        right: 26px;
        top: 60px;
        bottom: 60px;
        width: 2px;
        background: rgba(120, 140, 255, 0.22);
      }
      #rail .tick {
        position: absolute;
        right: -3px;
        width: 8px;
        height: 2px;
        background: rgba(120, 140, 255, 0.45);
      }
      #rail .tick.passed {
        background: rgba(109, 255, 176, 0.7);
      }
      #rail .tick span {
        position: absolute;
        right: 14px;
        top: -7px;
        font-size: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #59608a;
        white-space: nowrap;
      }
      #rail .tick.passed span {
        color: #6dffb0;
      }
      #rail .finish {
        position: absolute;
        right: -5px;
        top: -1px;
        width: 12px;
        height: 3px;
        background: #9fd6ff;
        box-shadow: 0 0 8px #9fd6ff;
      }
      #railMarker {
        position: absolute;
        right: -4px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #7a8bff;
        box-shadow: 0 0 10px rgba(122, 139, 255, 0.9);
        transform: translateY(-50%);
      }

      /* ---- dev panel ---- */
      #devPanel {
        position: absolute;
        left: 12px;
        top: 12px;
        width: 220px;
        background: rgba(10, 12, 24, 0.75);
        border: 1px solid rgba(120, 140, 255, 0.2);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 12px;
        pointer-events: all;
      }
      #devPanel h3 {
        margin: 0 0 8px;
        font-size: 12px;
        color: #8b93c4;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      #devPanel label {
        display: block;
        margin-top: 8px;
        color: #9aa3c7;
      }
      #devPanel input[type='range'] {
        width: 100%;
      }
      #devPanel select {
        width: 100%;
        margin-top: 3px;
        background: #171b30;
        color: #e8ecff;
        border: 1px solid #3a4268;
        border-radius: 5px;
        padding: 4px;
        font-size: 12px;
      }
      #devPanel .val {
        color: #e8ecff;
        float: right;
      }
      #devPanel button {
        margin-top: 12px;
        width: 100%;
        pointer-events: all;
        cursor: pointer;
        background: #2a3050;
        border: 1px solid #4a5384;
        color: #e8ecff;
        padding: 6px;
        border-radius: 6px;
      }

      /* ---- end screen ---- */
      #endScreen {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        background: rgba(3, 4, 10, 0.85);
        pointer-events: all;
      }
      #endScreen.show {
        display: flex;
      }
      #endScreen h1 {
        font-size: 40px;
        margin: 0;
      }
      #endScreen .row {
        color: #b7c0ea;
        font-size: 16px;
      }
      #endScreen button {
        margin-top: 18px;
        cursor: pointer;
        background: #4c5bff;
        border: none;
        color: white;
        font-size: 15px;
        padding: 10px 22px;
        border-radius: 8px;
      }
      #endScreen button:hover {
        background: #6272ff;
      }

      #hint {
        position: absolute;
        bottom: 15%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        color: #6a7190;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="statsBar">
        <div>WPM <b id="statWpm">0</b></div>
        <div>ACCURACY <b id="statAcc">100%</b></div>
        <div>DISTANCE <b id="statDist">0%</b></div>
      </div>

      <div id="rail">
        <div class="finish"></div>
        <div id="railMarker"></div>
      </div>

      <div id="promptBox">
        <div id="promptText"></div>
        <!-- Static, so the arc animations keep running instead of restarting
             every time the countdown ticks. -->
        <!-- The arcs crawl the border rather than crossing the panel. Bolts
             drawn through the middle read as a lattice over the words, and the
             whole point of this state is that the sentence stays readable. -->
        <div id="stallFx" aria-hidden="true">
          <svg viewBox="0 0 700 120" preserveAspectRatio="none">
            <path d="M40 4 L92 -4 L140 10 L196 -2 L248 6" />
            <path d="M452 6 L508 -4 L556 10 L612 -2 L664 5" />
            <path d="M36 116 L90 124 L138 108 L194 120 L246 113" />
            <path d="M456 113 L510 122 L558 107 L614 119 L666 114" />
            <path d="M8 22 L-4 48 L14 72 L2 100" />
            <path d="M692 20 L704 46 L686 72 L698 98" />
          </svg>
        </div>
        <div id="stallBadge"><i class="spark"></i>HULL BREACH <b id="stallTimer">5.0s</b></div>
      </div>
      <div id="hint">Build speed and stay consistent. Stop typing and you fall back to a crawl.</div>

      <div id="devPanel">
        <h3>DEV TUNING</h3>
        <label
          >Rocket
          <select id="selRocket"></select>
        </label>
        <label
          >Accel / char <span class="val" id="vAccel">0.09</span>
          <input type="range" id="sAccel" min="0.02" max="0.30" step="0.01" value="0.09" />
        </label>
        <label
          >Decay half-life (s) <span class="val" id="vHalf">1.4</span>
          <input type="range" id="sHalf" min="0.4" max="4.0" step="0.1" value="1.4" />
        </label>
        <label
          >Hull segments <span class="val" id="vHull">5</span>
          <input type="range" id="sHull" min="1" max="10" step="1" value="5" />
        </label>
        <label
          >Hull breach stall (s) <span class="val" id="vStall">5.0</span>
          <input type="range" id="sStall" min="0.5" max="15" step="0.5" value="5" />
        </label>
        <label
          >Race distance <span class="val" id="vDist">30</span>
          <input type="range" id="sDist" min="6" max="120" step="1" value="30" />
        </label>
        <label
          >Max speed <span class="val" id="vMaxSpeed">1.20</span>
          <input type="range" id="sMaxSpeed" min="0.2" max="3.0" step="0.05" value="1.2" />
        </label>
        <label
          >Min (cruise) speed <span class="val" id="vMinSpeed">0.15</span>
          <input type="range" id="sMinSpeed" min="0" max="0.6" step="0.01" value="0.15" />
        </label>
        <button id="btnRestart">Restart</button>
      </div>

      <div id="endScreen">
        <h1 id="endTitle">You crossed the heliopause</h1>
        <div class="row" id="endStats"></div>
        <button id="btnPlayAgain">Play again</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
