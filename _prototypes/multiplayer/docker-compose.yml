# Standalone from the repo root compose file on purpose.
#
# This playground answers one question (what does multiplayer look like, and does
# the netcode in the rating doc's 4.9 hold up) and should be startable without
# bringing up postgres, redis, pgadmin, mailpit and traefik to do it. Nothing here
# persists, so none of that is needed.
#
# Ports are shifted off the main stack's so both can run at once:
#   client  http://localhost:3100
#   server  ws://localhost:3101

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    volumes:
      - ./server/src:/app/src
      # Mounts on top of the bind above, so both packages compile against one
      # copy of the sim. Docker applies the longer path second, which is what
      # makes this ordering work.
      - ./shared:/app/src/shared
      - /app/node_modules
    environment:
      PORT: 3000
    ports:
      - "3101:3000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    volumes:
      - ./client/src:/app/src
      - ./shared:/app/src/shared
      - ./client/index.html:/app/index.html
      - /app/node_modules
    environment:
      # Points the browser at the published server port, not the compose service
      # name: this URL is resolved by the browser on the host, not by the client
      # container, so `server:3000` would not resolve.
      VITE_SERVER_URL: http://localhost:3101
    ports:
      - "3100:3000"
    depends_on:
      - server
