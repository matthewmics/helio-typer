<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HelioTyper multiplayer playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#05060a; --surface:#131832; --surface-2:#1a2043; --line:#262e58;
  --cyan:#4fd8ff; --pink:#ff4d84; --text:#e6e9f7; --dim:#828cb5;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:ui-monospace,'JetBrains Mono',monospace;overflow:hidden;}
#shell{display:flex;height:100vh;}
#stage{flex:1;display:flex;flex-direction:column;min-width:0;}
#canvas-wrap{flex:1;position:relative;min-height:0;}
canvas{width:100%;height:100%;display:block;}

#prompt{
  flex-shrink:0;padding:18px 24px;font-size:1.05rem;line-height:1.7;
  background:rgba(9,12,26,.94);border-top:1px solid var(--line);
  min-height:96px;position:relative;
}
#prompt .done{color:var(--cyan);}
#prompt .cur{background:var(--cyan);color:#04202a;border-radius:2px;}
#prompt .todo{color:var(--dim);}
#prompt.stalled .dead{color:#3d4360;}
#prompt.stalled{border-color:var(--pink);}
.stall-chip{
  position:absolute;top:-11px;left:24px;background:var(--pink);color:#2a0512;
  font-size:.66rem;font-weight:700;letter-spacing:.1em;padding:3px 11px;border-radius:20px;
}

#dev{
  width:290px;flex-shrink:0;overflow-y:auto;padding:16px;
  background:#0b0e1c;border-left:1px solid var(--line);
}
#dev h3{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--cyan);margin:0 0 4px;}
#dev .who{font-size:.66rem;color:var(--dim);margin-bottom:16px;}
.section{margin-bottom:18px;}
.section h4{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:0 0 9px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.knob{margin-bottom:9px;}
.knob-head{display:flex;justify-content:space-between;font-size:.64rem;
  color:var(--dim);margin-bottom:3px;}
.knob-head b{color:var(--text);}
.knob input[type=range]{width:100%;height:3px;accent-color:var(--cyan);}
.toggle{display:flex;align-items:center;gap:8px;font-size:.68rem;
  padding:9px 11px;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;cursor:pointer;margin-bottom:8px;}
.toggle input{accent-color:var(--cyan);}
.hint{font-size:.6rem;color:var(--dim);line-height:1.6;margin:0 0 18px;
  padding:9px 11px;background:rgba(166,120,255,.08);
  border:1px solid rgba(166,120,255,.26);border-radius:8px;}
.btns button{width:100%;padding:10px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--text);border-radius:8px;
  font-family:inherit;font-size:.68rem;cursor:pointer;}
.btns button:hover{border-color:var(--cyan);color:var(--cyan);}
.readout{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);}
.readout div{display:flex;justify-content:space-between;font-size:.64rem;
  color:var(--dim);padding:3px 0;}
.readout b{color:var(--text);}

#results{
  display:none;position:absolute;inset:40px;overflow-y:auto;z-index:20;
  background:rgba(7,9,18,.97);border:1px solid var(--line);border-radius:14px;padding:26px;
}
#results h3{margin:0 0 6px;font-size:1.1rem;}
#results .sub{font-size:.68rem;color:var(--dim);line-height:1.6;margin:0 0 18px;max-width:70ch;}
#results table{width:100%;border-collapse:collapse;font-size:.74rem;}
#results th{text-align:left;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding:0 10px 8px;font-weight:600;}
#results td{padding:9px 10px;border-top:1px solid var(--line);}
#results tr.me{background:rgba(79,216,255,.08);}
#results i{color:var(--dim);font-size:.62rem;font-style:normal;}
</style>
</head>
<body>
<div id="shell">
  <div id="stage">
    <div id="canvas-wrap">
      <canvas id="game"></canvas>
      <div id="results"></div>
    </div>
    <div id="prompt"></div>
  </div>
  <div id="dev">
    <h3>Dev tuning</h3>
    <div class="who">pilot: <b id="you">-</b> &middot; open a second tab to add a human</div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
